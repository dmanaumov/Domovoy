# Запускать из папки local-server/: docker compose up -d --build
# build.context указывает на корень репозитория, т.к. образу нужен ../web.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"

  local-server:
    build:
      context: ..
      dockerfile: local-server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      - mosquitto
    ports:
      - "3000:3000"
    volumes:
      # Сервер хранит сгенерированный LOCAL_TOKEN (data/local-token.json),
      # чтобы он не менялся при каждом пересоздании контейнера.
      - local-server-data:/app/data

volumes:
  mosquitto-data:
  local-server-data:
