name: Build and push images (для домашнего сервера / QNAP)

on:
  push:
    branches: [main]
    paths:
      - 'local-server/**'
      - 'web/**'
      - 'mosquitto/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Вычислить номер сборки (число коммитов в main)
        id: buildnum
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "build_number=$COUNT" >> "$GITHUB_OUTPUT"
          echo "версия сборки: 0.1.$COUNT"

      - name: Build and push local-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local-server/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=0.1.${{ steps.buildnum.outputs.build_number }}
          tags: ghcr.io/${{ github.repository_owner }}/domovoy-local-server:latest

      - name: Build and push mosquitto (с запечённым конфигом)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mosquitto/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/domovoy-mosquitto:latest
