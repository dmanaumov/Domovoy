<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Домовой</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151312" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="splash" class="splash">
    <img src="icons/icon-512.png" alt="" class="splash__logo" />
    <div class="splash__name">Домовой</div>
  </div>

  <header class="topbar">
    <h1>Домовой</h1>
    <span id="status" class="status status--offline">…</span>
  </header>

  <main id="devices" class="devices">
    <p class="hint">Подключаюсь…</p>
  </main>

  <button id="settings-btn" class="settings-btn" title="Настройки подключения">⚙</button>
  <button id="share-btn" class="settings-btn share-btn" title="Показать QR для другого устройства">⇄</button>
  <span id="version" class="version"></span>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>Подключение</h2>
      <label>Адрес локального сервера (LAN)
        <input type="text" id="local-url" placeholder="http://192.168.1.50:3000" />
      </label>
      <label>Адрес облачного релея
        <input type="text" id="cloud-url" placeholder="по умолчанию — этот же адрес" />
      </label>
      <label>Токен
        <input type="text" id="token" placeholder="токен доступа" />
      </label>
      <menu>
        <button value="cancel">Отмена</button>
        <button value="default" id="settings-save">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="share-dialog">
    <h2>Добавить устройство</h2>
    <p class="hint">Отсканируй камерой телефона — откроется ссылка, и токен подставится сам, без ручного ввода.</p>
    <div id="qr-container" class="qr-container"></div>
    <menu>
      <button id="share-close" value="default">Закрыть</button>
    </menu>
  </dialog>

  <script src="src/vendor/qrcode.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
